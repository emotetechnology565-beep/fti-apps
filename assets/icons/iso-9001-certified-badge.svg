<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#FBF0B9" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FBF0B9" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE89E" />
      <stop offset="50%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#E1B840" />
    </linearGradient>

    <!-- Navy Shield Gradients -->
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2442" />
      <stop offset="40%" stop-color="#08182D" />
      <stop offset="100%" stop-color="#040C17" />
    </linearGradient>

    <!-- Dropshadow filter -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- LEFT RECTANGLE BAR -->
    <!-- Top Gold Half -->
    <path d="M 30,50 L 260,50 L 260,86 L 30,86 Q 24,86 24,80 L 24,56 Q 24,50 30,50 Z" 
          fill="url(#goldPlate)" />
    <!-- Metallic Sheen line -->
    <line x1="24" y1="52" x2="260" y2="52" stroke="#FFF7D6" stroke-width="1.5" opacity="0.8" />

    <!-- "ISO 9001" Typography -->
    <text x="36" y="78" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="#0B1B36">ISO 9001</text>

    <!-- Bottom Navy Half -->
    <path d="M 24,86 L 260,86 L 260,114 Q 260,118 254,118 L 30,118 Q 24,118 24,112 Z" 
          fill="#0B1B36" />
    <line x1="24" y1="87" x2="260" y2="87" stroke="#162A48" stroke-width="1" />

    <!-- "CERTIFIED" Typography -->
    <text x="56" y="109" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="url(#goldText)">CERTIFIED</text>
  </g>

  <!-- RIGHT OVERLAPPING METALLIC SHIELD -->
  <g filter="url(#shieldGlow)">
    <!-- Outer Shield Bevel Rim -->
    <path d="M 290,20 
             Q 325,32 355,24 
             Q 350,75 330,115 
             Q 305,145 290,154 
             Q 275,145 250,115 
             Q 230,75 225,24 
             Q 255,32 290,20 Z" 
          fill="url(#goldBorder)" />

    <!-- Mid Shield Dark Accent Rim -->
    <path d="M 290,26 
             Q 322,37 348,30 
             Q 344,76 325,112 
             Q 303,139 290,147 
             Q 277,139 255,112 
             Q 236,76 232,30 
             Q 258,37 290,26 Z" 
          fill="#5C4713" />

    <!-- Inner Shield Gold Stroke -->
    <path d="M 290,30 
             Q 320,40 344,34 
             Q 340,77 322,110 
             Q 302,135 290,143 
             Q 278,135 258,110 
             Q 240,77 236,34 
             Q 260,40 290,30 Z" 
          fill="url(#goldBorder)" />

    <!-- Inner Shield Navy Body -->
    <path d="M 290,34 
             Q 317,44 338,38 
             Q 335,78 318,108 
             Q 299,131 290,138 
             Q 281,131 262,108 
             Q 245,78 242,38 
             Q 263,44 290,34 Z" 
          fill="url(#shieldNavy)" />

    <!-- Shield Inner Highlight Arch -->
    <path d="M 290,35 Q 315,44 336,39 Q 320,80 290,95 Q 260,80 244,39 Q 265,44 290,35 Z" 
          fill="white" opacity="0.08" />

    <!-- GOLD CHECKMARK (TICK) -->
    <path d="M 264,82 
             L 282,100 
             L 322,54 
             L 334,64 
             L 282,118 
             L 252,91 Z" 
          fill="url(#goldPlate)" />
    <!-- Checkmark 3D edge -->
    <path d="M 264,82 L 282,100 L 282,104 L 264,86 Z" fill="#9A7B1C" />
    <path d="M 282,100 L 322,54 L 325,56 L 282,104 Z" fill="#FFE89E" />
  </g>
</svg>